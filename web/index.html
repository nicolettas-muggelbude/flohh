<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flohh</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Texte kommen aus i18n.js (data-i18n="schlüssel"), nicht aus dem HTML. -->
  <header>
    <h1>
      <!-- Hell/dunkel nach Einstellung von System bzw. Browser -->
      <picture>
        <source srcset="img/flohh-logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="img/flohh-logo.svg" alt="flohh" width="182" height="72">
      </picture>
    </h1>
    <p class="sub" data-i18n="app.tagline"></p>
  </header>

  <main>
    <section class="roles" data-i18n-aria-label="roles.label">
      <button class="role" id="send" disabled>
        <span class="role-name" data-i18n="role.send.name"></span>
        <span class="role-note" data-i18n="role.send.note"></span>
      </button>
      <button class="role" id="receive" disabled>
        <span class="role-name" data-i18n="role.receive.name"></span>
        <span class="role-note" data-i18n="role.receive.note"></span>
      </button>
    </section>
    <p class="hint" data-i18n="hint.milestone"></p>
  </main>

  <footer>
    <span id="info" data-i18n="info.connecting"></span>
    <button id="quit" class="quiet" data-i18n="quit.button"></button>
  </footer>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
