<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flohh</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Texte kommen aus i18n.js (data-i18n="schlüssel"), nicht aus dem HTML. -->
  <header>
    <h1>
      <!-- Hell/dunkel nach Einstellung von System bzw. Browser -->
      <picture>
        <source srcset="img/flohh-logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img class="logo" src="img/flohh-logo.svg" alt="flohh" width="182" height="72">
      </picture>
    </h1>
    <p class="sub" data-i18n="app.tagline"></p>
  </header>

  <main>
    <!-- Startseite: Rolle wählen -->
    <section id="view-home">
      <div class="roles" role="group" data-i18n-aria-label="roles.label">
        <button class="role" data-role="send">
          <span class="role-name" data-i18n="role.send.name"></span>
          <span class="role-note" data-i18n="role.send.note"></span>
        </button>
        <button class="role" data-role="receive">
          <span class="role-name" data-i18n="role.receive.name"></span>
          <span class="role-note" data-i18n="role.receive.note"></span>
        </button>
      </div>
      <p class="hint" data-i18n="home.hint"></p>
    </section>

    <!-- Empfänger: Code anzeigen und warten -->
    <section id="view-receive" class="panel" hidden>
      <h2 data-i18n="receive.title"></h2>
      <p data-i18n="receive.instruction"></p>
      <p class="code" id="code" aria-live="polite"></p>
      <p class="status" id="receive-status" aria-live="polite"></p>
      <div class="actions">
        <button class="quiet" data-action="reset" data-i18n="common.cancel"></button>
      </div>
    </section>

    <!-- Sender: Rechner auswählen, Code eingeben -->
    <section id="view-send" class="panel" hidden>
      <h2 data-i18n="send.title"></h2>
      <p data-i18n="send.instruction"></p>
      <fieldset class="peers">
        <legend data-i18n="send.peersLabel"></legend>
        <div id="peer-list"></div>
        <p class="status" id="send-status" aria-live="polite"></p>
      </fieldset>
      <form id="pair-form" class="pair-form">
        <label for="code-input" data-i18n="send.codeLabel"></label>
        <div class="pair-row">
          <input id="code-input" inputmode="numeric" autocomplete="off" maxlength="7"
                 placeholder="123 456" required>
          <button type="submit" class="primary" id="pair-button" data-i18n="send.connect"></button>
        </div>
      </form>
      <div class="actions">
        <button class="quiet" data-action="reset" data-i18n="common.cancel"></button>
      </div>
    </section>

    <!-- Beide: gekoppelt -->
    <section id="view-connected" class="panel" hidden>
      <h2 data-i18n="connected.title"></h2>
      <p id="connected-text"></p>
      <p class="hint" data-i18n="connected.next"></p>
      <div class="actions">
        <button class="quiet" data-action="reset" data-i18n="connected.disconnect"></button>
      </div>
    </section>
  </main>

  <footer>
    <span id="info" data-i18n="info.connecting"></span>
    <button id="quit" class="quiet" data-i18n="quit.button"></button>
  </footer>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
